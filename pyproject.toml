[project]
name = "dw-fabric"
version = "0.1.0"
description = "Data Warehouse no Microsoft Fabric: ingestão (bancos e APIs), Bronze/Silver/Gold, rotinas e qualidade"
requires-python = ">=3.11"
# Notebooks: PySpark do Fabric Runtime 2.0 (Spark 4.1, Delta 4.2). Implantação e scripts locais:
# requests, azure-identity, truststore e deltalake (leitura do ctl_log pelo executar_ciclo.py).
dependencies = [
    "pyspark==4.1.1",
    "delta-spark==4.2.0",
    "deltalake>=0.20",
    "pyarrow>=15",
    "pandas>=2",
    "pyyaml>=6",
    "requests>=2.31",
    "azure-identity>=1.15",
    "truststore>=0.9",
]

[project.optional-dependencies]
# testes precisam de Java 21; no Windows, rodar pelo contêiner de tests/docker
teste = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
